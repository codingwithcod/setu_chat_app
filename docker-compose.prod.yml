# ============================================
# Prod Compose — Production with Traefik + SSL
# Usage: make deploy  (or manually via docker compose)
# ============================================

services:
  # ------------------------------------------
  # Traefik Reverse Proxy
  # ------------------------------------------
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      # --- API / Dashboard ---
      - "--api.dashboard=true"
      # --- Entrypoints ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # --- HTTP → HTTPS redirect ---
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # --- Let's Encrypt (TLS) ---
      - "--certificatesresolvers.letsencrypt.acme.email=theabhipatel.co@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # --- Docker provider (discovers services from ALL compose projects) ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=setu-network"
      # --- Logs ---
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
    labels:
      # --- Dashboard accessible at traefik.chat.theabhipatel.com ---
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.chat.theabhipatel.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # --- Basic Auth for dashboard (generate with: htpasswd -nB admin) ---
      # - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      # - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$..."
    networks:
      - setu-network

  # ------------------------------------------
  # Setu Chat App (Production overrides)
  # ------------------------------------------
  setu-app:
    build:
      args:
        - NEXT_PUBLIC_APP_URL=https://chat.theabhipatel.com
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://chat.theabhipatel.com
    # Resolve the self-hosted Supabase domain to Traefik inside Docker.
    # Without this, the container tries hairpin NAT (goes out to the internet
    # and back) which fails on most EC2/VPS setups. The middleware's JWKS
    # fetch and server-side Supabase calls need this to work.
    extra_hosts:
      - "supabase.chat.theabhipatel.com:host-gateway"
    labels:
      - "traefik.enable=true"
      # --- HTTPS Router ---
      - "traefik.http.routers.setu-app.rule=Host(`chat.theabhipatel.com`)"
      - "traefik.http.routers.setu-app.entrypoints=websecure"
      - "traefik.http.routers.setu-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.setu-app.loadbalancer.server.port=3000"
      # --- Security headers middleware ---
      - "traefik.http.routers.setu-app.middlewares=security-headers"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
    networks:
      - setu-network

# ------------------------------------------
# Persistent volumes
# ------------------------------------------
volumes:
  traefik-letsencrypt:
    driver: local
  traefik-logs:
    driver: local

# ------------------------------------------
# Shared external network (created by setup script)
# Both Setu App and Supabase join this network
# so Traefik can discover and proxy to both.
# ------------------------------------------
networks:
  setu-network:
    external: true
