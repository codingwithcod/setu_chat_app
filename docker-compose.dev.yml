# ============================================
# Dev Compose — Local development (no Traefik)
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up --build
# ============================================

services:
  setu-app:
    build:
      args:
        - NEXT_PUBLIC_APP_URL=http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
